<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velm - LMS UI</title>
    <meta name="description" content="Connects to LMS to download assignments, modules, and grades. Features data visualization, multiple export formats (CSV, XML, JSON), and Gemini AI-powered academic workload analysis." />
    <meta property="og:title" content="Velm - LMS UI" />
    <meta property="og:description" content="Connects to LMS to download assignments, modules, and grades. Features data visualization, multiple export formats (CSV, XML, JSON), and Gemini AI-powered academic workload analysis." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      /* 3D Flip Card Styles */
      .perspective-1000 {
        perspective: 1000px;
        -webkit-perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
        -webkit-transform: rotateY(180deg);
      }
      /* Instructions HTML & Prose styling */
      .instructions-content, .prose {
        line-height: 1.6;
        word-break: break-word;
      }
      .instructions-content a, .prose a {
        color: #2563eb !important;
        text-decoration: underline !important;
        font-weight: 500 !important;
        cursor: pointer !important;
        display: inline !important;
      }
      .instructions-content a:hover, .prose a:hover {
        color: #1d4ed8 !important;
      }
      .instructions-content span, .prose span,
      .instructions-content strong, .prose strong,
      .instructions-content em, .prose em,
      .instructions-content i, .prose i,
      .instructions-content b, .prose b {
        display: inline !important;
      }
      .instructions-content ul, .prose ul {
        list-style-type: disc !important;
        padding-left: 1.25rem !important;
        margin-top: 0.5rem !important;
        margin-bottom: 0.5rem !important;
      }
      .instructions-content ol, .prose ol {
        list-style-type: decimal !important;
        padding-left: 1.25rem !important;
        margin-top: 0.5rem !important;
        margin-bottom: 0.5rem !important;
      }
      .instructions-content li, .prose li {
        margin-bottom: 0.25rem !important;
      }
    </style>
    <script>
      // Gracefully prevent unhandled WebSocket/HMR rejection in iframe and container environments
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var message = (reason && reason.message) || String(reason || '');
        if (message.indexOf('WebSocket') !== -1 || message.indexOf('closed without opened') !== -1 || message.indexOf('vite:ws') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var filename = (event && event.filename) || '';
        if (msg.indexOf('WebSocket') !== -1 || filename.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased h-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
